<app-navbar></app-navbar>
<div class="container">
  <form class="formsText auth-card" [formGroup]="form" (ngSubmit)="login()">
    <div class="form-floating">
      <label for="floatingInput">{{
        "login-component.username" | translate
      }}</label>
      <input
        type="text"
        class="form-control"
        id="floatingInput"
        formControlName="username"
        autocomplete="username"
      />
    </div>
    <label for="floatingPassword">{{
      "login-component.password" | translate
    }}</label>
    <div class="form-floating">
      <input
        type="password"
        class="form-control"
        id="floatingPassword"
        formControlName="password"
        autocomplete="current-password"
      />
    </div>
    <p *ngIf="errorMessage" class="auth-error" role="alert">{{ errorMessage }}</p>
    <span
      >{{ "login-component.dont-have-login" | translate }}
      <a routerLink="/pages/register">{{
        "login-component.register" | translate
      }}</a></span
    >
    <button class="btn loginBtn" type="submit" [disabled]="isSubmitting">
      {{ "login-component.login" | translate }}
    </button>
  </form>
</div>
